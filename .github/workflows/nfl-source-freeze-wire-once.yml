name: nfl-source-freeze-wire-once

on:
  push:
    branches:
      - hardening/nfl-source-freeze-v2-20260913
    paths:
      - '.github/workflows/nfl-source-freeze-wire-once.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: hardening/nfl-source-freeze-v2-20260913
          fetch-depth: 0

      - name: Patch promotion workflow exactly once
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/football-nfl-promotion-evidence.yml')
          text = path.read_text()

          compile_old = "            sportsedge/sports/nfl/source_contract.py \\\n            sportsedge/sports/nfl/source_manifest.py \\\n"
          compile_new = "            sportsedge/sports/nfl/source_contract.py \\\n            sportsedge/sports/nfl/source_manifest.py \\\n            scripts/materialize_nfl_frozen_sources.py \\\n"
          if 'scripts/materialize_nfl_frozen_sources.py \\' not in text:
              if compile_old not in text:
                  raise SystemExit('NFL_SOURCE_WIRE_COMPILE_ANCHOR_MISSING')
              text = text.replace(compile_old, compile_new, 1)

          new_block = "\n".join([
              "      - name: Materialize SportsEdge-frozen NFL production sources",
              "        run: >-",
              "          python scripts/materialize_nfl_frozen_sources.py",
              "          --source-contract config/nfl_promotion_source_freeze_v1.json",
              "          --output-root artifacts/football/sources",
              "          --attestation-out artifacts/football/nfl_source_materialization_attestation.json",
              "",
          ])
          if 'Materialize SportsEdge-frozen NFL production sources' not in text:
              start_marker = '      - name: Freeze public NFL production sources\n'
              end_marker = '      - name: Build exact production-M2 walk-forward evidence\n'
              start = text.find(start_marker)
              end = text.find(end_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit(f'NFL_SOURCE_WIRE_DOWNLOAD_BLOCK_ANCHOR_MISSING:{start}:{end}')
              text = text[:start] + new_block + text[end:]

          starter_anchor = "          --stadium-file artifacts/football/sources/team_stadiums.csv\n          --git-sha \"$EVIDENCE_GIT_SHA\"\n"
          starter_new = "          --stadium-file artifacts/football/sources/team_stadiums.csv\n          --starter-override-file artifacts/football/sources/nfl_historical_starter_overrides.json\n          --git-sha \"$EVIDENCE_GIT_SHA\"\n"
          existing = text.count('--starter-override-file artifacts/football/sources/nfl_historical_starter_overrides.json')
          if existing == 0:
              count = text.count(starter_anchor)
              if count != 2:
                  raise SystemExit(f'NFL_SOURCE_WIRE_STARTER_ANCHOR_COUNT:{count}')
              text = text.replace(starter_anchor, starter_new)
          elif existing != 2:
              raise SystemExit(f'NFL_SOURCE_WIRE_STARTER_ALREADY_COUNT:{existing}')

          path.write_text(text)
          PY

      - name: Verify patch contract
        run: |
          grep -F 'Materialize SportsEdge-frozen NFL production sources' .github/workflows/football-nfl-promotion-evidence.yml
          test "$(grep -Fc -- '--starter-override-file artifacts/football/sources/nfl_historical_starter_overrides.json' .github/workflows/football-nfl-promotion-evidence.yml)" -eq 2
          test "$(grep -Fc 'scripts/materialize_nfl_frozen_sources.py' .github/workflows/football-nfl-promotion-evidence.yml)" -ge 2
          if grep -Fq 'nflverse/nflverse-data/releases/download/pbp/' .github/workflows/football-nfl-promotion-evidence.yml; then
            echo 'mutable nflverse PBP transport remains in promotion workflow' >&2
            exit 1
          fi

      - name: Commit wired workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- .github/workflows/football-nfl-promotion-evidence.yml; then
            echo 'promotion workflow already wired'
            exit 0
          fi
          git add .github/workflows/football-nfl-promotion-evidence.yml
          git commit -m 'ci(nfl): consume promotion inputs from frozen release store'
          git push origin HEAD:hardening/nfl-source-freeze-v2-20260913
