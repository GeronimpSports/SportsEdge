name: three-sport-core-certification-audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/audit_three_sport_core_certification.py'
      - 'tests/test_three_sport_core_certification.py'
      - '.github/workflows/three-sport-core-certification-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run fail-closed tests
        run: python -m unittest tests.test_three_sport_core_certification -v
      - name: Attach data branch read-only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin data:data
          git worktree add .data-branch data
      - name: Build three-sport core certification audit
        run: >-
          python scripts/audit_three_sport_core_certification.py
          --data-root .data-branch
          --out artifacts/three-sport-core-certification.json
      - name: Assert audit has zero authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('artifacts/three-sport-core-certification.json').read_text())
          for key, value in row['authority'].items():
              assert value is False, (key, value)
          print('THREE_SPORT_CERTIFICATION_AUDIT_ZERO_AUTHORITY_OK')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: three-sport-core-certification-${{ github.run_id }}
          path: artifacts/three-sport-core-certification.json
          if-no-files-found: error
          retention-days: 30
