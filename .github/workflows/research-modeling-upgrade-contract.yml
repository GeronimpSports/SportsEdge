name: research-modeling-upgrade-contract

on:
  pull_request:
    paths:
      - 'config/research/model_research_methodology_v1.json'
      - 'config/research/nfl_play_level_feature_contract_v1.json'
      - 'config/nfl_m2_freeze.json'
      - 'config/football_prop_engine_surface.json'
      - 'scripts/audit_research_modeling_upgrade.py'
      - '.github/workflows/research-modeling-upgrade-contract.yml'
  push:
    branches: [main]
    paths:
      - 'config/research/model_research_methodology_v1.json'
      - 'config/research/nfl_play_level_feature_contract_v1.json'
      - 'config/nfl_m2_freeze.json'
      - 'config/football_prop_engine_surface.json'
      - 'scripts/audit_research_modeling_upgrade.py'
      - '.github/workflows/research-modeling-upgrade-contract.yml'

permissions:
  contents: read

jobs:
  research-governance-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile audit
        run: python -m py_compile scripts/audit_research_modeling_upgrade.py
      - name: Enforce research-only boundary
        run: python scripts/audit_research_modeling_upgrade.py
