name: mlb-promotion-readiness-audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config/truth_gate_floors.json"
      - "config/mlb_validation_evidence.json"
      - "config/deployments.json"
      - "sportsedge/mlb_finish_line.py"
      - "sportsedge/mlb_promotion_readiness.py"
      - "sportsedge/edge_floors.py"
      - "scripts/audit_mlb_promotion_readiness.py"
      - "tests/test_mlb_promotion_readiness.py"
      - ".github/workflows/mlb-promotion-readiness-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Test floor-aware readiness contract
        run: python -m unittest tests.test_mlb_promotion_readiness -v
      - name: Build immutable diagnostic report
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python scripts/audit_mlb_promotion_readiness.py --out artifacts/mlb-promotion-readiness.json >/tmp/mlb-readiness.json
          python - <<'PY'
          import json
          row=json.load(open('artifacts/mlb-promotion-readiness.json'))
          authority=row['authority']
          assert authority['diagnostic_only'] is True
          for key in ('model_p_authority','promotion_authority','eligibility_authority','official_authority','floor_freeze_authority'):
              assert authority[key] is False, key
          for market in row['markets']:
              if market['official_ready']:
                  assert market['edge_floor']['frozen'] is True
                  assert market['acceptance_complete'] is True
                  assert market['deployment_eligible'] is True
          print(json.dumps({
              'market_count': row['market_count'],
              'six_gate_complete_count': row['six_gate_complete_count'],
              'frozen_edge_floor_count': row['frozen_edge_floor_count'],
              'official_ready_count': row['official_ready_count'],
          }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mlb-promotion-readiness-${{ github.run_id }}
          path: artifacts/mlb-promotion-readiness.json
          if-no-files-found: error
          retention-days: 30
