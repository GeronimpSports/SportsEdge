name: mlb-deadman

on:
  # MLB is parked for the remainder of 2026. Keep health/rescue available only
  # for an explicit manual invocation; do not restore any automatic schedule.
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  verify-auto-mlb-heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify auto-mlb has completed successfully and recently
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAX_AGE_MINUTES: '45'
        run: python scripts/check_mlb_auto_heartbeat.py

  archive-rescue-dispatch:
    # Manual-only and deliberately independent from the verifier. An operator
    # invoking this parked dead-man explicitly is requesting the archive rescue;
    # heartbeat uncertainty must not silently convert into a healthy verdict.
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch archive failover workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run archive-mlb-game-odds-failover.yml --ref main
          echo 'DEADMAN_DISPATCHED_ARCHIVE_FAILOVER'
