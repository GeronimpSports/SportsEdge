name: mlb-v8-actual-start-binding

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/attest_mlb_v8_actual_starts.py'
      - 'scripts/build_mlb_v8_oddspapi_pit_v2.py'
      - '.github/workflows/mlb-v8-actual-start-binding.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify fail-closed contracts
        run: |
          set -euo pipefail
          python -m py_compile scripts/attest_mlb_v8_actual_starts.py scripts/build_mlb_v8_oddspapi_pit_v2.py
          python scripts/attest_mlb_v8_actual_starts.py --self-test
          python scripts/build_mlb_v8_oddspapi_pit_v2.py --self-test

  bind-existing-history:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Attach data branch
        run: |
          set -euo pipefail
          git fetch origin data
          git worktree add --detach .data-branch FETCH_HEAD
          if [ ! -d .data-branch/evidence/mlb_v8_replay_sources/ODDSPAPI_HISTORICAL ]; then
            echo 'BLOCKED_NO_ODDSPAPI_HISTORICAL_ARCHIVE' >&2
            exit 78
          fi
          mkdir -p artifacts/mlb_v8_replay_sources
          cp -R .data-branch/evidence/mlb_v8_replay_sources/ODDSPAPI_HISTORICAL artifacts/mlb_v8_replay_sources/
      - name: Acquire official actual-first-play attestations
        run: python scripts/attest_mlb_v8_actual_starts.py
      - name: Build actual-start-bound historical pairs
        run: python scripts/build_mlb_v8_oddspapi_pit_v2.py
      - name: Require non-empty attested paired-close evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('artifacts/mlb_v8_replay_sources/ODDSPAPI_HISTORICAL')
          att_dir = root / 'actual_starts'
          attestations = sorted(att_dir.glob('*.json')) if att_dir.is_dir() else []
          summary_path = Path('artifacts/mlb_v8_replay_archive/oddspapi_pit_v2/summary.json')
          if not summary_path.is_file():
              raise SystemExit('BLOCKED_NO_V2_PIT_SUMMARY')
          summary = json.loads(summary_path.read_text(encoding='utf-8'))
          counts = summary.get('counts') or {}
          paired_closes = int(counts.get('actual_start_bound_paired_closes') or 0)
          t30_pairs = int(counts.get('actual_start_bound_t30_pairs') or 0)
          print(json.dumps({
              'actual_start_attestations': len(attestations),
              'actual_start_bound_t30_pairs': t30_pairs,
              'actual_start_bound_paired_closes': paired_closes,
              'promotion_authority': False,
          }, sort_keys=True))
          if not attestations:
              raise SystemExit('BLOCKED_ZERO_ACTUAL_START_ATTESTATIONS')
          if t30_pairs <= 0:
              raise SystemExit('BLOCKED_ZERO_ACTUAL_START_BOUND_T30_PAIRS')
          if paired_closes <= 0:
              raise SystemExit('BLOCKED_ZERO_ACTUAL_START_BOUND_PAIRED_CLOSES')
          PY
      - name: Persist append-only provenance products
        run: |
          set -euo pipefail
          mkdir -p .data-branch/evidence/mlb_v8_replay_sources/ODDSPAPI_HISTORICAL/actual_starts
          mkdir -p .data-branch/evidence/mlb_v8_replay_archive/oddspapi_pit_v2
          cp -R artifacts/mlb_v8_replay_sources/ODDSPAPI_HISTORICAL/actual_starts/. .data-branch/evidence/mlb_v8_replay_sources/ODDSPAPI_HISTORICAL/actual_starts/
          cp -R artifacts/mlb_v8_replay_archive/oddspapi_pit_v2/. .data-branch/evidence/mlb_v8_replay_archive/oddspapi_pit_v2/
          cd .data-branch
          git config user.name sportsedge-v8-start-bind-bot
          git config user.email sportsedge-v8-start-bind-bot@users.noreply.github.com
          git add evidence/mlb_v8_replay_sources/ODDSPAPI_HISTORICAL/actual_starts evidence/mlb_v8_replay_archive/oddspapi_pit_v2
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "evidence: bind MLB V8 historical pairs to actual first play [NO_PROMOTION_AUTHORITY]"
          for attempt in 1 2 3; do
            git fetch origin data
            git rebase origin/data || { git rebase --abort || true; exit 97; }
            if git push origin HEAD:data; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 98
