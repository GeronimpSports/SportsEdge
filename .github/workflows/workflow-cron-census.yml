name: workflow-cron-census

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'config/workflow_cron_policy_v1.json'
      - 'scripts/audit_workflow_cron_census.py'

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Audit scheduled workflows against frozen cron policy
        run: python3 scripts/audit_workflow_cron_census.py --repo-root . --out artifacts/audit/workflow_cron_census.json
      - name: Upload census
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workflow-cron-census
          path: artifacts/audit/workflow_cron_census.json
          if-no-files-found: error
          retention-days: 14
