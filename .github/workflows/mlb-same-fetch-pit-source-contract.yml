name: mlb-same-fetch-pit-source-contract

on:
  pull_request:
    paths:
      - 'sportsedge/mlb_source.py'
      - 'sportsedge/mlb_pit_binding.py'
      - 'scripts/run_auto_mlb_resilient.py'
      - 'scripts/run_mlb_v8_forward_lane_v2.py'
      - 'tests/test_mlb_same_fetch_source_capture.py'
      - 'tests/test_mlb_pit_binding.py'
      - '.github/workflows/mlb-v8-evidence.yml'
      - '.github/workflows/mlb-same-fetch-pit-source-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
          check-latest: false
      - name: Compile same-fetch PIT path
        run: >-
          python -m py_compile
          sportsedge/mlb_source.py
          sportsedge/mlb_pit_binding.py
          scripts/run_auto_mlb_resilient.py
          scripts/run_mlb_v8_forward_lane_v2.py
      - name: Verify exact-response source capture
        run: python -m unittest tests.test_mlb_same_fetch_source_capture -v
      - name: Verify PIT source binding fails closed
        run: python -m unittest tests.test_mlb_pit_binding -v
      - name: Verify V8 decision materialization binding
        run: python scripts/run_mlb_v8_forward_lane_v2.py --self-test
      - name: Verify downstream replay-ready classifier
        run: python scripts/audit_mlb_v8_forward_pit_provenance.py --self-test
      - name: Verify workflow retains raw sources and uses V2
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/mlb-v8-evidence.yml').read_text()
          assert 'SPORTSEDGE_MLB_PIT_SOURCE_DIR: evidence/mlb_v8_pit_sources' in text
          assert 'python scripts/run_mlb_v8_forward_lane_v2.py' in text
          assert 'evidence/mlb_v8_pit_sources' in text
          assert 'git add evidence/mlb_v8_pit_sources' in text
          assert 'ubuntu-latest' not in text
          assert 'python-version-file' in text
          print('MLB_SAME_FETCH_PIT_WORKFLOW_CONTRACT_OK')
          PY
