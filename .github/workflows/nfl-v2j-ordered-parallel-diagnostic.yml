name: nfl-v2j-ordered-parallel-diagnostic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sportsedge/sports/nfl/m2_v2j_ordered_parallel.py'
      - 'sportsedge/sports/nfl/m2_v2j_runtime_cache.py'
      - 'tests/test_nfl_m2_v2j_runtime_cache.py'
      - 'config/nfl_promotion_source_freeze_v1.json'
      - '.github/workflows/nfl-v2j-ordered-parallel-diagnostic.yml'

permissions:
  contents: read

jobs:
  ordered-parallel-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EVIDENCE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_GIT_SHA }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install diagnostic dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.3 pytest==9.1.1

      - name: Prove focused exactness contract
        run: |
          python -m py_compile \
            sportsedge/sports/nfl/m2_v2j_ordered_parallel.py \
            sportsedge/sports/nfl/m2_v2j_runtime_cache.py
          python -m pytest -q tests/test_nfl_m2_v2j_runtime_cache.py

      - name: Materialize immutable NFL diagnostic sources
        run: >-
          python scripts/materialize_nfl_frozen_sources.py
          --source-contract config/nfl_promotion_source_freeze_v1.json
          --output-root artifacts/football/v2j_parallel/sources
          --attestation-out artifacts/football/v2j_parallel/source_materialization_attestation.json

      - name: Benchmark ordered parallelism on real walk-forward folds
        env:
          TZ: UTC
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          from sportsedge.core.walkforward.season import season_walk_forward
          from sportsedge.sports.nfl.history import normalize_nfl_rows, parse_schedule_csv
          from sportsedge.sports.nfl.m2_history_features import fit_nfl_prior_decay_curves
          from sportsedge.sports.nfl.m2_history_policy import build_nfl_m2_history_rows
          from sportsedge.sports.nfl.m2_v2h_candidate import build_nfl_v2h_game_event_rows
          from sportsedge.sports.nfl.m2_v2j_candidate import fit_nfl_m2_v2j_candidate
          from sportsedge.sports.nfl.m2_v2j_ordered_parallel import ordered_parallel_market_readouts_exact_cached
          from sportsedge.sports.nfl.m2_v2j_runtime_cache import market_readout_exact_cached
          from scripts.build_nfl_v2g_source_bound_artifact import _identity_scoped_pbp, _normalize_schedule_team_aliases
          from scripts.run_nfl_production_validation import (
              _PBP_FIELDS, _PARTICIPATION_FIELDS, _DEPTH_FIELDS, _STADIUM_FIELDS,
              _files, _extend, _read_projected, bridge_preopening_away_origins,
              audit_starting_qb_coverage, apply_pinned_starting_qb_overrides,
          )

          root = Path('artifacts/football/v2j_parallel/sources')
          schedule = normalize_nfl_rows(
              parse_schedule_csv((root / 'games.csv').read_text(encoding='utf-8-sig')),
              range(2016, 2026),
          )
          pbp_files = _files(root / 'pbp', 'play_by_play_{season}.{ext}', 2016, 2025)
          participation_files = _files(root / 'participation', 'pbp_participation_{season}.{ext}', 2016, 2025)
          depth_files = _files(root / 'depth', 'depth_charts_{season}.{ext}', 2016, 2025)
          pbp=[]; participation=[]; depth=[]; scoring_pbp=[]
          scoring_fields={"game_id","posteam","drive","touchdown","td_team","play_type","field_goal_result","extra_point_result","two_point_conv_result","safety"}
          _extend(pbp,pbp_files,_PBP_FIELDS)
          _extend(participation,participation_files,_PARTICIPATION_FIELDS)
          _extend(depth,depth_files,_DEPTH_FIELDS)
          _extend(scoring_pbp,pbp_files,scoring_fields)
          stadiums,_ = bridge_preopening_away_origins(schedule,_read_projected(root/'team_stadiums.csv',_STADIUM_FIELDS))
          prior_curves = fit_nfl_prior_decay_curves(schedule,pbp,min_train_seasons=2,weeks=range(1,7))
          overrides = json.loads((root/'nfl_historical_starter_overrides.json').read_text(encoding='utf-8'))
          depth,_ = apply_pinned_starting_qb_overrides(schedule,depth,overrides)
          gaps = audit_starting_qb_coverage(schedule,depth,eligible_seasons=prior_curves)
          if gaps:
              raise SystemExit(f'NFL_V2J_PARALLEL_STARTING_QB_GAPS:{len(gaps)}')
          history_rows = build_nfl_m2_history_rows(
              schedule,pbp,participation,depth,stadiums,
              prior_decay_curves=prior_curves,
              neutral_site_policy='exclude_from_evaluation',
              exclusion_report={},
          )
          scoring_schedule,_ = _normalize_schedule_team_aliases([dict(row) for row in schedule])
          scoring_pbp,_ = _identity_scoped_pbp(scoring_pbp)
          event_rows = build_nfl_v2h_game_event_rows(scoring_schedule,scoring_pbp)
          eligible_ids={str(r.get('game_id') or '') for r in history_rows}
          event_rows=[r for r in event_rows if str(r.get('game_id') or '') in eligible_ids]
          by_game={str(r.get('game_id') or ''):r for r in history_rows}
          folds=season_walk_forward(history_rows,season_key='season',min_train_seasons=2)

          worker_count=min(4, os.cpu_count() or 1)
          if worker_count < 2:
              raise SystemExit('NFL_V2J_PARALLEL_HOSTED_WORKER_COUNT_INSUFFICIENT')
          fold_results=[]
          projected_serial_seconds=0.0
          projected_parallel_seconds=0.0
          for fold in folds:
              train_seasons={int(r['season']) for r in fold.train_rows}
              train_events=[r for r in event_rows if int(r['season']) in train_seasons and str(r.get('game_id') or '') in by_game]
              model=fit_nfl_m2_v2j_candidate(train_events,fold.train_rows)
              if not fold.test_rows:
                  continue
              sample_n=min(worker_count, len(fold.test_rows))
              rows=tuple(dict(row) for row in fold.test_rows[:sample_n])

              t0=time.perf_counter()
              serial=tuple(market_readout_exact_cached(model,row) for row in rows)
              serial_seconds=time.perf_counter()-t0

              t0=time.perf_counter()
              parallel=ordered_parallel_market_readouts_exact_cached(model,rows,max_workers=worker_count)
              parallel_seconds=time.perf_counter()-t0

              if parallel != serial:
                  raise SystemExit(f"NFL_V2J_PARALLEL_NONIDENTICAL:{rows[0].get('game_id')}")
              if parallel_seconds <= 0.0 or serial_seconds <= 0.0:
                  raise SystemExit('NFL_V2J_PARALLEL_TIMING_INVALID')

              speedup=serial_seconds/parallel_seconds
              test_n=len(fold.test_rows)
              projected_serial=serial_seconds/sample_n*test_n
              projected_parallel=parallel_seconds/sample_n*test_n
              projected_serial_seconds += projected_serial
              projected_parallel_seconds += projected_parallel
              fold_results.append({
                  'test_season':int(rows[0]['season']),
                  'sample_game_ids':[str(row.get('game_id') or '') for row in rows],
                  'sample_game_count':sample_n,
                  'test_game_count':test_n,
                  'shared_environment_support_points':len(model.shared_environment),
                  'worker_count':worker_count,
                  'serial_cached_seconds':serial_seconds,
                  'parallel_cached_seconds':parallel_seconds,
                  'parallel_speedup_ratio':speedup,
                  'projected_serial_cached_seconds':projected_serial,
                  'projected_parallel_cached_seconds':projected_parallel,
                  'exact_python_payload_equal':True,
                  'input_result_order_preserved':True,
              })

          payload={
              'schema_version':1,
              'status':'ORDERED_PARALLEL_REAL_HISTORY_DIAGNOSTIC_ONLY',
              'code_git_sha':os.environ['EVIDENCE_GIT_SHA'].lower(),
              'historical_window':[2016,2025],
              'worker_count':worker_count,
              'fold_count':len(fold_results),
              'folds':fold_results,
              'projected_serial_cached_minutes':projected_serial_seconds/60.0,
              'projected_parallel_cached_minutes':projected_parallel_seconds/60.0,
              'exact_parallel_payload_equal_all_folds':True,
              'input_result_order_preserved_all_folds':True,
              'predictive_verdict':None,
              'calibration_verdict':None,
              'full_readout_authorized':False,
              'promotion_authority':False,
              'model_p_authority':False,
              'staking_authority':False,
              'official_authority':False,
          }
          out=Path('artifacts/football/v2j_parallel/nfl_v2j_ordered_parallel_diagnostic.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(payload,sort_keys=True))
          PY

      - name: Enforce diagnostic-only authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/football/v2j_parallel/nfl_v2j_ordered_parallel_diagnostic.json').read_text())
          if p.get('status')!='ORDERED_PARALLEL_REAL_HISTORY_DIAGNOSTIC_ONLY': raise SystemExit('NFL_V2J_PARALLEL_STATUS_INVALID')
          if p.get('exact_parallel_payload_equal_all_folds') is not True: raise SystemExit('NFL_V2J_PARALLEL_EQUIVALENCE_REQUIRED')
          if p.get('input_result_order_preserved_all_folds') is not True: raise SystemExit('NFL_V2J_PARALLEL_ORDER_REQUIRED')
          for f in ('full_readout_authorized','promotion_authority','model_p_authority','staking_authority','official_authority'):
              if p.get(f) is not False: raise SystemExit('NFL_V2J_PARALLEL_FORBIDDEN_AUTHORITY:'+f)
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-v2j-ordered-parallel-diagnostic-${{ env.EVIDENCE_GIT_SHA }}
          path: |
            artifacts/football/v2j_parallel/nfl_v2j_ordered_parallel_diagnostic.json
            artifacts/football/v2j_parallel/source_materialization_attestation.json
          if-no-files-found: error
          retention-days: 30
