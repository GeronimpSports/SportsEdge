name: mlb-pit-lineup-starter-contract

on:
  pull_request:
    paths:
      - 'scripts/archive_mlb_pit_lineup_starters.py'
      - '.github/workflows/mlb-pit-lineup-starter-archive.yml'
      - '.github/workflows/mlb-pit-lineup-starter-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile and self-test source archive
        run: |
          set -euo pipefail
          python -m py_compile scripts/archive_mlb_pit_lineup_starters.py
          python scripts/archive_mlb_pit_lineup_starters.py --self-test
      - name: Assert source-only authority contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('scripts/archive_mlb_pit_lineup_starters.py').read_text()
          required = [
              'retroactive_point_in_time_claim',
              'promotion_authority',
              'model_p_authority',
              'schedule_source_sha256',
              'boxscore_source_sha256',
              'observed_at_utc',
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit(f'MLB_PIT_ARCHIVE_CONTRACT_MISSING:{missing}')
          if '"promotion_authority": False' not in text or '"model_p_authority": False' not in text:
              raise SystemExit('MLB_PIT_ARCHIVE_AUTHORITY_MUST_FAIL_CLOSED')
          print('MLB_PIT_LINEUP_STARTER_CONTRACT_OK')
          PY
