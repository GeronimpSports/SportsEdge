name: mlb-cfb-prop-engine-governance

on:
  pull_request:
    paths:
      - 'config/research/mlb_cfb_prop_engine_build_order_v1.json'
      - 'tests/test_mlb_cfb_prop_engine_build_order.py'
      - '.github/workflows/mlb-cfb-prop-engine-governance.yml'
  push:
    branches: [main]
    paths:
      - 'config/research/mlb_cfb_prop_engine_build_order_v1.json'
      - 'tests/test_mlb_cfb_prop_engine_build_order.py'
      - '.github/workflows/mlb-cfb-prop-engine-governance.yml'

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Enforce MLB and CFB prop build order
        run: python -m unittest tests.test_mlb_cfb_prop_engine_build_order -v
