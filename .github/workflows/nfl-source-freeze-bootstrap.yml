name: nfl-source-freeze-bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - hardening/nfl-source-freeze-v2-20260913
    paths:
      - '.github/workflows/nfl-source-freeze-bootstrap.yml'
      - 'config/nfl_promotion_source_freeze_v1.json'

permissions:
  contents: write

jobs:
  bootstrap-frozen-store:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      FREEZE_TAG: nfl-source-freeze-v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Build exact frozen-asset bootstrap plan
        run: |
          python - <<'PY' > /tmp/nfl-source-freeze-plan.tsv
          import json
          from pathlib import Path

          contract = json.loads(Path('config/nfl_promotion_source_freeze_v1.json').read_text())
          rows = []
          for name, row in contract['sources'].items():
              identity = row['upstream_identity']
              if identity['type'] == 'sportsedge_repo_file':
                  asset = Path(identity['path']).name
                  origin = 'repo://' + identity['path']
              else:
                  asset = Path(identity['path']).name
                  origin = row.get('origin_uri') or row['uri']
              rows.append((name, origin, row['expected_sha256'], asset))
          for prefix, row in contract['seasonal_sources'].items():
              identity = row['upstream_identity']
              origin_template = row.get('origin_uri_template') or row['uri_template']
              for season in row['seasons']:
                  asset = identity['asset_template'].format(season=season)
                  origin = origin_template.format(season=season)
                  expected = row['expected_sha256_by_season'][str(season)]
                  rows.append((f'{prefix}_{season}', origin, expected, asset))
          if len(rows) != 33:
              raise SystemExit(f'NFL_SOURCE_FREEZE_PLAN_COUNT_INVALID:{len(rows)}')
          assets = [r[3] for r in rows]
          if len(set(assets)) != len(assets):
              raise SystemExit('NFL_SOURCE_FREEZE_ASSET_NAME_DUPLICATE')
          for row in sorted(rows):
              print('\t'.join(row))
          PY

      - name: Materialize and verify all frozen bytes before release mutation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nfl-source-freeze-stage
          fetch_source() {
            local url="$1"
            local output="$2"
            curl --fail --location --silent --show-error \
              --retry 5 --retry-delay 2 --retry-all-errors \
              --connect-timeout 30 \
              "$url" -o "$output"
          }
          while IFS=$'\t' read -r name origin expected asset; do
            target="/tmp/nfl-source-freeze-stage/${asset}"
            if [[ "$origin" == repo://* ]]; then
              cp "${origin#repo://}" "$target"
            else
              fetch_source "$origin" "$target"
            fi
            printf '%s  %s\n' "$expected" "$target" | sha256sum --check --strict
            printf '%s\t%s\t%s\n' "$asset" "$expected" "$name" >> /tmp/nfl-source-freeze-verified.tsv
          done < /tmp/nfl-source-freeze-plan.tsv
          test "$(wc -l < /tmp/nfl-source-freeze-verified.tsv)" -eq 33

      - name: Create release once or verify existing release identity
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$FREEZE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_ENV"
          else
            gh release create "$FREEZE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'NFL promotion source freeze v1' \
              --notes 'Content-addressed historical NFL source bytes frozen from SportsEdge promotion evidence. Assets are append-only: existing asset names must never be overwritten.'
            echo "release_exists=false" >> "$GITHUB_ENV"
          fi

      - name: Upload only missing assets; never overwrite an existing asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nfl-source-freeze-existing
          while IFS=$'\t' read -r asset expected name; do
            rm -f "/tmp/nfl-source-freeze-existing/${asset}"
            if gh release download "$FREEZE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset" \
              --dir /tmp/nfl-source-freeze-existing >/dev/null 2>&1; then
              printf '%s  %s\n' "$expected" "/tmp/nfl-source-freeze-existing/${asset}" | sha256sum --check --strict
              continue
            fi
            gh release upload "$FREEZE_TAG" "/tmp/nfl-source-freeze-stage/${asset}" \
              --repo "$GITHUB_REPOSITORY"
          done < /tmp/nfl-source-freeze-verified.tsv

      - name: Verify complete release byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nfl-source-freeze-final
          mkdir -p /tmp/nfl-source-freeze-final
          while IFS=$'\t' read -r asset expected name; do
            gh release download "$FREEZE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset" \
              --dir /tmp/nfl-source-freeze-final
            printf '%s  %s\n' "$expected" "/tmp/nfl-source-freeze-final/${asset}" | sha256sum --check --strict
          done < /tmp/nfl-source-freeze-verified.tsv
          release_assets=$(gh release view "$FREEZE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          test "$release_assets" -eq 33

      - name: Emit frozen-store attestation
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          contract_path = Path('config/nfl_promotion_source_freeze_v1.json')
          contract = json.loads(contract_path.read_text())
          canonical = json.dumps(contract, sort_keys=True, separators=(',', ':'), ensure_ascii=True).encode()
          rows = []
          for line in Path('/tmp/nfl-source-freeze-verified.tsv').read_text().splitlines():
              asset, sha256, name = line.split('\t')
              rows.append({'name': name, 'asset': asset, 'sha256': sha256})
          out = {
              'schema_version': 1,
              'status': 'PASS',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'release_tag': os.environ['FREEZE_TAG'],
              'source_contract_sha256': hashlib.sha256(canonical).hexdigest(),
              'asset_count': len(rows),
              'overwrite_forbidden': True,
              'assets': sorted(rows, key=lambda r: r['name']),
          }
          Path('/tmp/nfl_source_freeze_store_attestation.json').write_text(json.dumps(out, indent=2, sort_keys=True) + '\n')
          print(json.dumps({'status': out['status'], 'asset_count': out['asset_count'], 'release_tag': out['release_tag']}, sort_keys=True))
          PY
