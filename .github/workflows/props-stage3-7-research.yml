name: props-stage3-7-research
on:
  pull_request:
    paths:
      - 'sportsedge/props_joint_stage3.py'
      - 'sportsedge/props_event_stage4.py'
      - 'sportsedge/props_pit_stage5.py'
      - 'sportsedge/props_validation_stage6.py'
      - 'sportsedge/props_validation_provenance_stage6.py'
      - 'sportsedge/props_market_binding_stage7.py'
      - 'tests/test_props_stage3_6_one_sweep.py'
      - 'tests/test_props_stage6_validation_contract.py'
      - 'tests/test_props_validation_provenance_stage6.py'
      - 'tests/test_props_validation_authority_contract.py'
      - '.github/workflows/props-stage3-7-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Compile research prop modules
        run: >-
          python -m compileall -q
          sportsedge/props_joint_stage3.py
          sportsedge/props_event_stage4.py
          sportsedge/props_pit_stage5.py
          sportsedge/props_validation_stage6.py
          sportsedge/props_validation_provenance_stage6.py
          sportsedge/props_market_binding_stage7.py
          tests/test_props_stage3_6_one_sweep.py
          tests/test_props_stage6_validation_contract.py
          tests/test_props_validation_provenance_stage6.py
          tests/test_props_validation_authority_contract.py
      - name: Run Stage 3-7 research contracts
        run: >-
          python -m pytest -q
          tests/test_props_stage3_6_one_sweep.py
          tests/test_props_stage6_validation_contract.py
          tests/test_props_validation_provenance_stage6.py
          tests/test_props_validation_authority_contract.py
