name: nfl-2026-prospective-governance

on:
  pull_request:
    paths:
      - 'config/nfl_2026_prospective_governance_v1.json'
      - 'config/research/nfl_play_level_research_generation_v1.json'
      - 'sportsedge/sports/nfl/archive_adjudication.py'
      - 'tests/test_nfl_2026_prospective_governance.py'
      - '.github/workflows/nfl-2026-prospective-governance.yml'
  push:
    branches: [main]
    paths:
      - 'config/nfl_2026_prospective_governance_v1.json'
      - 'config/research/nfl_play_level_research_generation_v1.json'
      - 'sportsedge/sports/nfl/archive_adjudication.py'
      - 'tests/test_nfl_2026_prospective_governance.py'
      - '.github/workflows/nfl-2026-prospective-governance.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Compile governance surface
        run: python -m py_compile sportsedge/sports/nfl/archive_adjudication.py tests/test_nfl_2026_prospective_governance.py
      - name: Run prospective governance contracts
        run: python -m unittest tests.test_nfl_2026_prospective_governance -v
      - name: Assert Truth Gate floors remain provenance-only
        run: python -m unittest tests.test_edge_floors tests.test_floor_provenance -v
