name: nfl-v2j-timeout-successor

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sportsedge/sports/nfl/m2_v2j_runtime_cache.py'
      - 'sportsedge/sports/nfl/m2_v2j_runtime_shard.py'
      - 'scripts/run_nfl_v2j_fold_shard.py'
      - 'scripts/merge_nfl_v2j_fold_shards.py'
      - 'config/research/nfl_v2j_timeout_successor_v1.json'
      - 'tests/test_nfl_m2_v2j_runtime_cache.py'
      - 'tests/test_nfl_m2_v2j_runtime_shard.py'
      - 'tests/test_nfl_v2j_timeout_successor_contract.py'
      - '.github/workflows/nfl-v2j-timeout-successor.yml'
  push:
    branches: [main]
    paths:
      - 'config/research/nfl_v2j_timeout_successor_v1.json'

permissions:
  contents: read

concurrency:
  group: nfl-v2j-timeout-successor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    outputs:
      execution_enabled: ${{ steps.policy.outputs.execution_enabled }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - run: python -m pip install --disable-pip-version-check numpy==2.5.3 pytest==9.1.1

      - id: policy
        name: Verify frozen timeout-successor policy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path('config/research/nfl_v2j_timeout_successor_v1.json').read_text())
          if p.get('policy_id')!='NFL_V2J_TIMEOUT_SUCCESSOR_V1': raise SystemExit('NFL_V2J_TIMEOUT_SUCCESSOR_POLICY_ID_INVALID')
          if p.get('status') not in {'FROZEN_PRE_ACTIVATION','FROZEN_ACTIVE_ONE_SHOT'}: raise SystemExit('NFL_V2J_TIMEOUT_SUCCESSOR_STATUS_INVALID')
          pred=p.get('predecessor') or {}
          if pred.get('workflow_run_id')!=34754505720 or pred.get('conclusion')!='cancelled' or pred.get('artifacts_emitted')!=0:
              raise SystemExit('NFL_V2J_TIMEOUT_SUCCESSOR_PREDECESSOR_BINDING_INVALID')
          geom=p.get('successor_geometry') or {}
          if geom.get('strategy')!='ONE_JOB_PER_FROZEN_WALK_FORWARD_TEST_SEASON': raise SystemExit('NFL_V2J_TIMEOUT_SUCCESSOR_GEOMETRY_INVALID')
          if geom.get('test_seasons')!=[2020,2021,2022,2023,2024,2025]: raise SystemExit('NFL_V2J_TIMEOUT_SUCCESSOR_SEASONS_INVALID')
          if geom.get('row_subsharding') is not False: raise SystemExit('NFL_V2J_TIMEOUT_SUCCESSOR_ROW_SUBSHARDING_FORBIDDEN')
          if float(geom.get('max_projected_fold_minutes',9999)) >= float(geom.get('hosted_timeout_minutes',0)):
              raise SystemExit('NFL_V2J_TIMEOUT_SUCCESSOR_RUNTIME_MARGIN_INVALID')
          auth=p.get('authority') or {}
          for f in ('model_p_authority','promotion_authority','staking_authority','official_authority'):
              if auth.get(f) is not False: raise SystemExit('NFL_V2J_TIMEOUT_SUCCESSOR_FORBIDDEN_AUTHORITY:'+f)
          enabled='true' if p.get('execution_enabled') is True else 'false'
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as h: h.write(f'execution_enabled={enabled}\n')
          print(json.dumps({'status':p['status'],'execution_enabled':p.get('execution_enabled'),'max_projected_fold_minutes':geom['max_projected_fold_minutes']},sort_keys=True))
          PY

      - name: Compile exact successor surface
        run: >-
          python -m py_compile
          sportsedge/sports/nfl/m2_v2j_runtime_cache.py
          sportsedge/sports/nfl/m2_v2j_runtime_shard.py
          scripts/run_nfl_v2j_fold_shard.py
          scripts/merge_nfl_v2j_fold_shards.py

      - name: Prove exact cache and shard contracts
        run: >-
          python -m pytest -q
          tests/test_nfl_m2_v2j_runtime_cache.py
          tests/test_nfl_m2_v2j_runtime_shard.py
          tests/test_nfl_v2j_timeout_successor_contract.py

  fold:
    if: github.event_name == 'push' && needs.contract.outputs.execution_enabled == 'true'
    needs: contract
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        test_season: [2020, 2021, 2022, 2023, 2024, 2025]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      EVIDENCE_GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_GIT_SHA }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - run: python -m pip install --disable-pip-version-check numpy==2.5.3 pytest==9.1.1

      - name: Materialize SportsEdge-frozen NFL sources
        run: >-
          python scripts/materialize_nfl_frozen_sources.py
          --source-contract config/nfl_promotion_source_freeze_v1.json
          --output-root artifacts/football/v2j_successor/sources
          --attestation-out artifacts/football/v2j_successor/source_materialization_attestation.json

      - name: Build exact frozen source manifest
        env:
          TZ: UTC
        run: >-
          python scripts/run_nfl_production_validation_frozen.py
          --source-contract config/nfl_promotion_source_freeze_v1.json
          --freeze-attestation-out artifacts/football/v2j_successor/nfl_source_freeze_attestation.json
          --schedule-file artifacts/football/v2j_successor/sources/games.csv
          --pbp-dir artifacts/football/v2j_successor/sources/pbp
          --participation-dir artifacts/football/v2j_successor/sources/participation
          --depth-dir artifacts/football/v2j_successor/sources/depth
          --stadium-file artifacts/football/v2j_successor/sources/team_stadiums.csv
          --starter-override-file artifacts/football/v2j_successor/sources/nfl_historical_starter_overrides.json
          --git-sha "$EVIDENCE_GIT_SHA"
          --start-season 2016 --end-season 2025
          --neutral-site-policy exclude_from_evaluation
          --out artifacts/football/v2j_successor/nfl_production_validation.json
          --manifest-out artifacts/football/v2j_successor/nfl_source_manifest.json
          --model-out artifacts/football/v2j_successor/nfl_m2_model.json
          --qb-coverage-out artifacts/football/v2j_successor/nfl_starting_qb_coverage.json

      - name: Run exact held-out fold
        env:
          TZ: UTC
        run: >-
          python scripts/run_nfl_v2j_fold_shard.py
          --schedule-file artifacts/football/v2j_successor/sources/games.csv
          --pbp-dir artifacts/football/v2j_successor/sources/pbp
          --participation-dir artifacts/football/v2j_successor/sources/participation
          --depth-dir artifacts/football/v2j_successor/sources/depth
          --stadium-file artifacts/football/v2j_successor/sources/team_stadiums.csv
          --starter-override-file artifacts/football/v2j_successor/sources/nfl_historical_starter_overrides.json
          --source-manifest artifacts/football/v2j_successor/nfl_source_manifest.json
          --code-git-sha "$EVIDENCE_GIT_SHA"
          --test-season ${{ matrix.test_season }}
          --start-season 2016 --end-season 2025
          --out artifacts/football/v2j_successor/folds/nfl_v2j_fold_${{ matrix.test_season }}.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-v2j-timeout-fold-${{ matrix.test_season }}-${{ github.sha }}
          path: artifacts/football/v2j_successor/folds/nfl_v2j_fold_${{ matrix.test_season }}.json
          if-no-files-found: error
          retention-days: 30

  merge:
    if: github.event_name == 'push' && needs.contract.outputs.execution_enabled == 'true'
    needs: [contract, fold]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EVIDENCE_GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_GIT_SHA }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - run: python -m pip install --disable-pip-version-check numpy==2.5.3 pytest==9.1.1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: nfl-v2j-timeout-fold-*-${{ github.sha }}
          path: artifacts/football/v2j_successor/downloaded
          merge-multiple: true

      - name: Merge exact fold outputs and reconstruct frozen evidence
        run: >-
          python scripts/merge_nfl_v2j_fold_shards.py
          --shard-root artifacts/football/v2j_successor/downloaded
          --predecessor-run-id 34754505720
          --predecessor-head-sha 6f16e003b94502845ce38991897f2cca83fe6375
          --runtime-benchmark-run-id 34788427799
          --runtime-benchmark-head-sha bb33708409e02c05384ebdc3d047e8f92cbd8897
          --out artifacts/football/v2j_successor/nfl_v2j_first_readout.json
          --execution-attestation-out artifacts/football/v2j_successor/nfl_v2j_timeout_successor_attestation.json

      - name: Materialize frozen schedule for unchanged key audit
        run: >-
          python scripts/materialize_nfl_frozen_sources.py
          --source-contract config/nfl_promotion_source_freeze_v1.json
          --output-root artifacts/football/v2j_successor/merge_sources
          --attestation-out artifacts/football/v2j_successor/merge_source_materialization_attestation.json

      - name: Build frozen real-history key audit
        run: >-
          python scripts/audit_nfl_real_history.py
          --source-file artifacts/football/v2j_successor/merge_sources/games.csv
          --min-season 1999 --max-season 2025
          --output artifacts/football/v2j_successor/nfl_real_history_audit.json

      - name: Compare successor to unchanged frozen key tolerance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from sportsedge.sports.nfl.simulator_profile import build_nfl_simulator_profile, validate_profile_fit
          audit=json.loads(Path('artifacts/football/v2j_successor/nfl_real_history_audit.json').read_text())
          e=json.loads(Path('artifacts/football/v2j_successor/nfl_v2j_first_readout.json').read_text())
          profile=build_nfl_simulator_profile(audit,version='nfl-v2j-first-readout-oos-key-emergent-v1')
          raw=e['candidate_distribution_profile']['signed_key_probability']
          keys=tuple(sorted(int(k) for k in profile['validation_target_key_frequency']))
          fit=validate_profile_fit(profile,{k:float(raw[str(k)]) for k in keys},max_abs_error=0.005)
          payload={'schema_version':1,'status':'FIRST_READOUT_DIAGNOSTIC_ONLY','max_abs_error':0.005,'fit':fit,'promotion_eligible':False,'promotion_authority':False,'model_p_authority':False,'official_status_granted':False,'production_registry_consumes_this_artifact':False}
          Path('artifacts/football/v2j_successor/nfl_v2j_key_math.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          print(json.dumps(payload,sort_keys=True))
          PY

      - name: Enforce successor zero authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('artifacts/football/v2j_successor/nfl_v2j_first_readout.json').read_text())
          a=json.loads(Path('artifacts/football/v2j_successor/nfl_v2j_timeout_successor_attestation.json').read_text())
          if e.get('status')!='FIRST_READOUT_DIAGNOSTIC_ONLY' or e.get('preregistration_locked') is not True: raise SystemExit('NFL_V2J_TIMEOUT_SUCCESSOR_LOCK_REQUIRED')
          if e.get('post_readout_retuning_allowed') is not False: raise SystemExit('NFL_V2J_TIMEOUT_SUCCESSOR_RETUNING_FORBIDDEN')
          if e.get('market_prices_consumed_as_model_features') is not False: raise SystemExit('NFL_V2J_TIMEOUT_SUCCESSOR_MARKET_FEATURE_CONTAMINATION')
          if e.get('prospective_outcomes_consumed_for_tuning') is not False: raise SystemExit('NFL_V2J_TIMEOUT_SUCCESSOR_PROSPECTIVE_TUNING_FORBIDDEN')
          if e.get('v2h_or_v2i_readout_values_consumed_for_numeric_tuning') is not False: raise SystemExit('NFL_V2J_TIMEOUT_SUCCESSOR_PRIOR_READOUT_TUNING_FORBIDDEN')
          for f in ('promotion_eligible','promotion_authority','model_p_authority','official_status_granted','production_registry_consumes_this_artifact'):
              if e.get(f) is not False: raise SystemExit('NFL_V2J_TIMEOUT_SUCCESSOR_ZERO_AUTHORITY_REQUIRED:'+f)
          if e.get('nfl_props')!='NO_ENGINE': raise SystemExit('NFL_V2J_TIMEOUT_SUCCESSOR_PROPS_MUST_REMAIN_NO_ENGINE')
          if a.get('status')!='EXACT_FOLD_SHARDED_EXECUTION_COMPLETE_ZERO_AUTHORITY': raise SystemExit('NFL_V2J_TIMEOUT_SUCCESSOR_ATTESTATION_INVALID')
          if a.get('predecessor_run_id')!=34754505720: raise SystemExit('NFL_V2J_TIMEOUT_SUCCESSOR_PREDECESSOR_DRIFT')
          for f in ('promotion_authority','model_p_authority','staking_authority','official_authority'):
              if a.get(f) is not False: raise SystemExit('NFL_V2J_TIMEOUT_SUCCESSOR_ATTESTATION_AUTHORITY_FORBIDDEN:'+f)
          print(json.dumps({'status':e['status'],'historical':e['candidate_historical_evidence'],'signed_key_probability':e['candidate_distribution_profile']['signed_key_probability'],'promotion_authority':False,'nfl_props':'NO_ENGINE'},sort_keys=True))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-v2j-timeout-successor-${{ github.sha }}
          path: |
            artifacts/football/v2j_successor/nfl_v2j_first_readout.json
            artifacts/football/v2j_successor/nfl_v2j_timeout_successor_attestation.json
            artifacts/football/v2j_successor/nfl_real_history_audit.json
            artifacts/football/v2j_successor/nfl_v2j_key_math.json
          if-no-files-found: error
          retention-days: 90
