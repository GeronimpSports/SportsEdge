name: mlb-v8-oddspapi-replay-readiness-v2

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audit_mlb_v8_paired_replay_readiness_v2.py'
      - 'scripts/build_mlb_v8_oddspapi_pit_v2.py'
      - 'scripts/build_mlb_v8_oddspapi_pit.py'
      - 'sportsedge/sports/mlb/paired_replay_readiness.py'
      - '.github/workflows/mlb-v8-actual-start-binding.yml'
      - '.github/workflows/mlb-v8-oddspapi-replay-readiness-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile and exercise fail-closed readiness contracts
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/audit_mlb_v8_paired_replay_readiness_v2.py \
            scripts/build_mlb_v8_oddspapi_pit_v2.py \
            sportsedge/sports/mlb/paired_replay_readiness.py
          python scripts/build_mlb_v8_oddspapi_pit_v2.py --self-test
          python scripts/audit_mlb_v8_paired_replay_readiness_v2.py --self-test
      - name: Assert no authority is introduced
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('scripts/audit_mlb_v8_paired_replay_readiness_v2.py').read_text(encoding='utf-8')
          required = [
              'promotion_authority',
              'may_change_market_eligibility',
              'strict_replay_max_age_seconds',
              'catalog_threshold_binding_reverified',
              'raw_history_reverified',
              'actual_start_bound',
          ]
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit(f'MISSING_FAIL_CLOSED_CONTRACT_FIELDS:{missing}')
          PY
