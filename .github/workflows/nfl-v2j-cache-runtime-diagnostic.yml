name: nfl-v2j-cache-runtime-diagnostic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sportsedge/sports/nfl/m2_v2j_runtime_cache.py'
      - 'tests/test_nfl_m2_v2j_runtime_cache.py'
      - '.github/workflows/nfl-v2j-cache-runtime-diagnostic.yml'

jobs:
  exact-equivalence-and-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EVIDENCE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_GIT_SHA }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install diagnostic dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.3 pytest==9.1.1

      - name: Prove exact deterministic equivalence
        run: python -m pytest -q tests/test_nfl_m2_v2j_runtime_cache.py

      - name: Measure bounded hosted-runner kernel runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/football
          python - <<'PY'
          import json
          import runpy
          import time
          from dataclasses import replace
          from pathlib import Path

          from sportsedge.sports.nfl.m2_v2j_runtime_cache import market_readout_exact_cached
          from sportsedge.sports.nfl.m2_v2j_validation import _market_readout

          ns = runpy.run_path('tests/test_nfl_m2_v2j_runtime_cache.py')
          fit = ns['fit_nfl_m2_v2j_candidate']
          model = fit(ns['training_events'](), ns['training_features']())
          row = ns['prediction_row'](-3.0, 45.0)

          # Runtime-shape diagnostic only: repeat the existing support values to create
          # a larger normalized shared-environment support without changing either
          # implementation's arithmetic contract. This is not model evidence and is
          # never consumed by RUN IT, promotion, staking, or OFFICIAL authority.
          base_env = tuple(model.shared_environment)
          support_n = 600
          expanded = tuple((base_env[i % len(base_env)][0], 1.0 / support_n) for i in range(support_n))
          stress_model = replace(model, shared_environment=expanded)

          t0 = time.perf_counter()
          reference = _market_readout(stress_model, row)
          reference_seconds = time.perf_counter() - t0

          t0 = time.perf_counter()
          cached = market_readout_exact_cached(stress_model, row)
          cached_seconds = time.perf_counter() - t0

          if cached != reference:
              raise SystemExit('NFL_V2J_CACHE_DIAGNOSTIC_NONIDENTICAL_OUTPUT')

          payload = {
              'status': 'DIAGNOSTIC_ONLY_EXACT_EQUIVALENCE_PASS',
              'code_git_sha': __import__('os').environ['EVIDENCE_GIT_SHA'].lower(),
              'shared_environment_support_points': support_n,
              'reference_seconds': reference_seconds,
              'cached_seconds': cached_seconds,
              'speedup_ratio': reference_seconds / cached_seconds if cached_seconds > 0 else None,
              'exact_python_payload_equal': True,
              'predictive_verdict': None,
              'calibration_verdict': None,
              'promotion_authority': False,
              'model_p_authority': False,
              'staking_authority': False,
              'official_authority': False,
              'full_readout_authorized': False,
          }
          Path('artifacts/football/nfl_v2j_cache_runtime_diagnostic.json').write_text(
              json.dumps(payload, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Enforce diagnostic-only authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('artifacts/football/nfl_v2j_cache_runtime_diagnostic.json').read_text())
          if p.get('status') != 'DIAGNOSTIC_ONLY_EXACT_EQUIVALENCE_PASS':
              raise SystemExit('NFL_V2J_CACHE_DIAGNOSTIC_STATUS_INVALID')
          if p.get('exact_python_payload_equal') is not True:
              raise SystemExit('NFL_V2J_CACHE_DIAGNOSTIC_EQUIVALENCE_REQUIRED')
          for field in ('promotion_authority','model_p_authority','staking_authority','official_authority','full_readout_authorized'):
              if p.get(field) is not False:
                  raise SystemExit(f'NFL_V2J_CACHE_DIAGNOSTIC_FORBIDDEN_AUTHORITY:{field}')
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-v2j-cache-runtime-diagnostic-${{ env.EVIDENCE_GIT_SHA }}
          path: artifacts/football/nfl_v2j_cache_runtime_diagnostic.json
          if-no-files-found: error
          retention-days: 30
