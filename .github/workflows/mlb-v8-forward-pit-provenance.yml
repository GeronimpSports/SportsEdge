name: mlb-v8-forward-pit-provenance

on:
  pull_request:
    paths:
      - 'scripts/audit_mlb_v8_forward_pit_provenance.py'
      - '.github/workflows/mlb-v8-forward-pit-provenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
          check-latest: false
      - name: Verify forward PIT provenance fail-closed contract
        run: python scripts/audit_mlb_v8_forward_pit_provenance.py --self-test
