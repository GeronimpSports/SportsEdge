name: mlb-pit-lineup-starter-archive

on:
  workflow_dispatch:
    inputs:
      slate_date:
        description: Optional MLB slate date YYYY-MM-DD; default is current Chicago date
        required: false
        default: ''
  schedule:
    # March-October, 11:00 CT-ish through midnight CT-ish. The source records
    # observation UTC, so DST does not affect evidence ordering.
    - cron: '*/15 16-23 * 3-10 *'
    - cron: '*/15 0-5 * 3-10 *'

permissions:
  contents: write

concurrency:
  group: mlb-pit-lineup-starter-archive
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify archive contract
        run: |
          set -euo pipefail
          python scripts/archive_mlb_pit_lineup_starters.py --self-test

      - name: Resolve slate date
        id: date
        env:
          INPUT_DATE: ${{ inputs.slate_date }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_DATE:-}" ]; then
            SLATE_DATE="$INPUT_DATE"
          else
            SLATE_DATE=$(TZ=America/Chicago date +%F)
          fi
          echo "slate_date=$SLATE_DATE" >> "$GITHUB_OUTPUT"

      - name: Capture immutable MLB source observations
        run: |
          set -euo pipefail
          python scripts/archive_mlb_pit_lineup_starters.py \
            --date '${{ steps.date.outputs.slate_date }}' \
            --root artifacts/mlb_pit_inputs

      - name: Persist append-only evidence to data
        run: |
          set -euo pipefail
          git fetch origin data
          git worktree add --detach .data-pit origin/data
          mkdir -p .data-pit/evidence/mlb_pit_inputs
          cp -R artifacts/mlb_pit_inputs/. .data-pit/evidence/mlb_pit_inputs/
          (
            cd .data-pit
            git config user.name sportsedge-mlb-pit-bot
            git config user.email sportsedge-mlb-pit-bot@users.noreply.github.com
            git add evidence/mlb_pit_inputs
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "evidence: MLB PIT lineup/starter capture ${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:data; then
                exit 0
              fi
              git fetch origin data
              git rebase origin/data
              sleep $((attempt * 2))
            done
            exit 98
          )

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mlb-pit-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mlb_pit_inputs
          if-no-files-found: error
          retention-days: 30
