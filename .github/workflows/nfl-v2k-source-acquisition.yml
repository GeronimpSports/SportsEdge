name: nfl-v2k-source-acquisition

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Comma-separated preregistered seasons; default resolves the remaining 2010-2018 provenance gap.'
        required: false
        default: '2010,2011,2012,2013,2014,2015,2016,2017,2018'

permissions:
  contents: read

jobs:
  provenance-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Compile source-only acquisition surface
        run: >-
          python -m py_compile
          sportsedge/sports/nfl/v2k_source_acquisition_contract.py
          scripts/acquire_nfl_v2k_source_assets.py
          tests/test_nfl_v2k_source_acquisition_contract.py
          tests/test_nfl_v2k_source_acquisition_script.py
      - name: Run offline source-acquisition contracts
        run: >-
          python -m unittest
          tests.test_nfl_v2k_source_acquisition_contract
          tests.test_nfl_v2k_source_acquisition_script -v
      - name: Acquire unresolved preregistered source bytes and compute direct SHA256
        run: >-
          python scripts/acquire_nfl_v2k_source_assets.py
          --seasons '${{ inputs.seasons }}'
          --output artifacts/football/v2k/source-acquisition.json
      - name: Enforce provenance-only authority boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/football/v2k/source-acquisition.json')
          d=json.loads(p.read_text())
          assert d['status']=='PROVENANCE_ONLY_NOT_MODEL_EVIDENCE'
          assert d['objects']
          assert d['model_fit_invoked'] is False
          assert d['evaluation_invoked'] is False
          assert d['readout_consumed'] is False
          for key in ('model_p_authority','promotion_authority','truth_gate_authority','staking_authority','official_authority'):
              assert d[key] is False, key
          for row in d['objects']:
              assert row['evidence_method']=='DIRECT_DOWNLOADED_BYTE_SHA256'
              assert len(row['sha256'])==64
              assert row['byte_count'] > 0
          PY
      - name: Upload source provenance only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-v2k-source-provenance-${{ github.run_id }}
          path: artifacts/football/v2k/source-acquisition.json
          if-no-files-found: error
          retention-days: 90
