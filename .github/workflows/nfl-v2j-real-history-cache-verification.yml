name: nfl-v2j-real-history-cache-verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sportsedge/sports/nfl/m2_v2j_runtime_cache.py'
      - '.github/workflows/nfl-v2j-real-history-cache-verification.yml'

permissions:
  contents: read

jobs:
  real-history-cache-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EVIDENCE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_GIT_SHA }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - run: python -m pip install --disable-pip-version-check numpy==2.5.3 pytest==9.1.1

      - name: Fetch historical diagnostic sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/football/v2j_real_cache/sources/{pbp,participation,depth}
          fetch_source(){ curl --fail --location --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 30 "$1" -o "$2"; }
          fetch_source 'https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv' artifacts/football/v2j_real_cache/sources/games.csv
          fetch_source 'https://raw.githubusercontent.com/greerreNFL/Stadiums/efa9543af50b01424754219fa0e4f3c7044ff198/data/team_stadiums.csv' artifacts/football/v2j_real_cache/sources/team_stadiums.csv
          for season in $(seq 2016 2025); do
            fetch_source "https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_${season}.csv.gz" "artifacts/football/v2j_real_cache/sources/pbp/play_by_play_${season}.csv.gz"
            fetch_source "https://github.com/nflverse/nflverse-data/releases/download/pbp_participation/pbp_participation_${season}.csv" "artifacts/football/v2j_real_cache/sources/participation/pbp_participation_${season}.csv"
            fetch_source "https://github.com/nflverse/nflverse-data/releases/download/depth_charts/depth_charts_${season}.csv" "artifacts/football/v2j_real_cache/sources/depth/depth_charts_${season}.csv"
          done

      - name: Build real-history rows and compare one held-out game per fold
        env:
          TZ: UTC
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          from sportsedge.core.walkforward.season import season_walk_forward
          from sportsedge.sports.nfl.history import normalize_nfl_rows, parse_schedule_csv
          from sportsedge.sports.nfl.m2_history_features import fit_nfl_prior_decay_curves
          from sportsedge.sports.nfl.m2_history_policy import build_nfl_m2_history_rows
          from sportsedge.sports.nfl.m2_v2h_candidate import build_nfl_v2h_game_event_rows
          from sportsedge.sports.nfl.m2_v2j_candidate import fit_nfl_m2_v2j_candidate
          from sportsedge.sports.nfl.m2_v2j_runtime_cache import market_readout_exact_cached
          from sportsedge.sports.nfl.m2_v2j_validation import _market_readout
          from scripts.build_nfl_v2g_source_bound_artifact import _identity_scoped_pbp, _normalize_schedule_team_aliases
          from scripts.run_nfl_production_validation import (
              _PBP_FIELDS, _PARTICIPATION_FIELDS, _DEPTH_FIELDS, _STADIUM_FIELDS,
              _files, _extend, _read_projected, bridge_preopening_away_origins,
              audit_starting_qb_coverage, apply_pinned_starting_qb_overrides,
          )

          root = Path('artifacts/football/v2j_real_cache/sources')
          schedule = normalize_nfl_rows(parse_schedule_csv((root/'games.csv').read_text(encoding='utf-8-sig')), range(2016, 2026))
          pbp_files = _files(root/'pbp', 'play_by_play_{season}.{ext}', 2016, 2025)
          participation_files = _files(root/'participation', 'pbp_participation_{season}.{ext}', 2016, 2025)
          depth_files = _files(root/'depth', 'depth_charts_{season}.{ext}', 2016, 2025)
          pbp=[]; participation=[]; depth=[]; scoring_pbp=[]
          scoring_fields={"game_id","posteam","drive","touchdown","td_team","play_type","field_goal_result","extra_point_result","two_point_conv_result","safety"}
          _extend(pbp,pbp_files,_PBP_FIELDS)
          _extend(participation,participation_files,_PARTICIPATION_FIELDS)
          _extend(depth,depth_files,_DEPTH_FIELDS)
          _extend(scoring_pbp,pbp_files,scoring_fields)
          stadiums,_ = bridge_preopening_away_origins(schedule,_read_projected(root/'team_stadiums.csv',_STADIUM_FIELDS))
          prior_curves = fit_nfl_prior_decay_curves(schedule,pbp,min_train_seasons=2,weeks=range(1,7))
          overrides = json.loads(Path('config/nfl_historical_starter_overrides.json').read_text(encoding='utf-8'))
          depth,_ = apply_pinned_starting_qb_overrides(schedule,depth,overrides)
          gaps = audit_starting_qb_coverage(schedule,depth,eligible_seasons=prior_curves)
          if gaps:
              raise SystemExit(f'NFL_V2J_REAL_CACHE_STARTING_QB_GAPS:{len(gaps)}')
          history_rows = build_nfl_m2_history_rows(
              schedule,pbp,participation,depth,stadiums,
              prior_decay_curves=prior_curves,
              neutral_site_policy='exclude_from_evaluation',
              exclusion_report={},
          )
          scoring_schedule,_ = _normalize_schedule_team_aliases([dict(row) for row in schedule])
          scoring_pbp,_ = _identity_scoped_pbp(scoring_pbp)
          event_rows = build_nfl_v2h_game_event_rows(scoring_schedule,scoring_pbp)
          eligible_ids={str(r.get('game_id') or '') for r in history_rows}
          event_rows=[r for r in event_rows if str(r.get('game_id') or '') in eligible_ids]
          by_game={str(r.get('game_id') or ''):r for r in history_rows}
          folds=season_walk_forward(history_rows,season_key='season',min_train_seasons=2)

          fold_results=[]
          projected_reference_seconds=0.0
          projected_cached_seconds=0.0
          for fold in folds:
              train_seasons={int(r['season']) for r in fold.train_rows}
              train_events=[r for r in event_rows if int(r['season']) in train_seasons and str(r.get('game_id') or '') in by_game]
              model=fit_nfl_m2_v2j_candidate(train_events,fold.train_rows)
              if not fold.test_rows:
                  continue
              row=dict(fold.test_rows[0])
              t0=time.perf_counter(); reference=_market_readout(model,row); reference_seconds=time.perf_counter()-t0
              t0=time.perf_counter(); cached=market_readout_exact_cached(model,row); cached_seconds=time.perf_counter()-t0
              if cached != reference:
                  raise SystemExit(f"NFL_V2J_REAL_CACHE_NONIDENTICAL:{row.get('game_id')}")
              test_n=len(fold.test_rows)
              projected_reference_seconds += reference_seconds * test_n
              projected_cached_seconds += cached_seconds * test_n
              fold_results.append({
                  'test_season': int(row['season']),
                  'representative_game_id': str(row.get('game_id') or ''),
                  'train_seasons': sorted(train_seasons),
                  'test_game_count': test_n,
                  'shared_environment_support_points': len(model.shared_environment),
                  'reference_seconds': reference_seconds,
                  'cached_seconds': cached_seconds,
                  'speedup_ratio': reference_seconds/cached_seconds if cached_seconds>0 else None,
                  'exact_python_payload_equal': True,
              })

          payload={
              'schema_version':1,
              'status':'REAL_HISTORY_CACHE_EQUIVALENCE_DIAGNOSTIC_ONLY',
              'code_git_sha':os.environ['EVIDENCE_GIT_SHA'].lower(),
              'historical_window':[2016,2025],
              'fold_count':len(fold_results),
              'folds':fold_results,
              'projected_reference_kernel_seconds_from_one_row_per_fold':projected_reference_seconds,
              'projected_cached_kernel_seconds_from_one_row_per_fold':projected_cached_seconds,
              'projected_cached_kernel_minutes_from_one_row_per_fold':projected_cached_seconds/60.0,
              'exact_real_row_payload_equal_all_folds':True,
              'predictive_verdict':None,
              'calibration_verdict':None,
              'full_readout_authorized':False,
              'promotion_authority':False,
              'model_p_authority':False,
              'staking_authority':False,
              'official_authority':False,
          }
          out=Path('artifacts/football/v2j_real_cache/nfl_v2j_real_history_cache_verification.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(payload,sort_keys=True))
          PY

      - name: Enforce diagnostic-only authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/football/v2j_real_cache/nfl_v2j_real_history_cache_verification.json').read_text())
          if p.get('status')!='REAL_HISTORY_CACHE_EQUIVALENCE_DIAGNOSTIC_ONLY': raise SystemExit('NFL_V2J_REAL_CACHE_STATUS_INVALID')
          if p.get('exact_real_row_payload_equal_all_folds') is not True: raise SystemExit('NFL_V2J_REAL_CACHE_EQUIVALENCE_REQUIRED')
          for f in ('full_readout_authorized','promotion_authority','model_p_authority','staking_authority','official_authority'):
              if p.get(f) is not False: raise SystemExit('NFL_V2J_REAL_CACHE_FORBIDDEN_AUTHORITY:'+f)
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-v2j-real-history-cache-verification-${{ env.EVIDENCE_GIT_SHA }}
          path: artifacts/football/v2j_real_cache/nfl_v2j_real_history_cache_verification.json
          if-no-files-found: error
          retention-days: 30
