name: nfl-player-outcome-g1

on:
  pull_request:
    paths:
      - 'config/research/nfl_player_outcome_engine_g1.json'
      - 'sportsedge/sports/nfl/player_outcomes_g1.py'
      - 'sportsedge/sports/nfl/player_outcomes_g1_validation.py'
      - 'tests/test_nfl_player_outcomes_g1.py'
      - 'tests/test_nfl_player_outcomes_g1_validation.py'
      - '.github/workflows/nfl-player-outcome-g1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Compile G1 research surface
        run: python -m py_compile sportsedge/sports/nfl/player_outcomes_g1.py sportsedge/sports/nfl/player_outcomes_g1_validation.py tests/test_nfl_player_outcomes_g1.py tests/test_nfl_player_outcomes_g1_validation.py
      - name: Run G1 research contracts
        run: python -m unittest tests.test_nfl_player_outcomes_g1 tests.test_nfl_player_outcomes_g1_validation -v
      - name: Assert football props remain fail-closed
        run: python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path('config/football_prop_engine_surface.json').read_text())
          assert cfg['sports']['NFL']['engine_state'] == 'NO_ENGINE'
          assert cfg['sports']['NFL']['promotion_state'] == 'BLOCKED_NO_VALIDATED_PROBABILITY_ENGINE'
          print('NFL props remain NO_ENGINE')
          PY
