name: nfl-v2j-first-readout

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sportsedge/sports/nfl/m2_v2j_candidate.py'
      - 'sportsedge/sports/nfl/m2_v2j_validation.py'
      - 'scripts/run_nfl_v2j_first_readout.py'
      - 'config/research/nfl_v2j_conditioned_drive_regime_prereg_2026-09-12.json'
      - '.github/workflows/nfl-v2j-first-readout.yml'
  push:
    branches: [main]
    paths:
      - 'sportsedge/sports/nfl/m2_v2j_candidate.py'
      - 'sportsedge/sports/nfl/m2_v2j_validation.py'
      - 'scripts/run_nfl_v2j_first_readout.py'
      - 'config/research/nfl_v2j_conditioned_drive_regime_prereg_2026-09-12.json'
      - '.github/workflows/nfl-v2j-first-readout.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.5.3 pytest==9.1.1
      - name: Compile V2J readout surface
        run: python -m py_compile sportsedge/sports/nfl/m2_v2j_candidate.py sportsedge/sports/nfl/m2_v2j_validation.py scripts/run_nfl_v2j_first_readout.py
      - name: Run NFL contracts
        run: python -m unittest discover -s tests -p 'test_nfl*.py' -v

  first-readout:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EVIDENCE_GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_GIT_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.5.3 pytest==9.1.1
      - name: Fetch exact frozen NFL sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/football/v2j/sources/{pbp,participation,depth}
          fetch_source(){ curl --fail --location --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 30 "$1" -o "$2"; }
          fetch_source 'https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv' artifacts/football/v2j/sources/games.csv
          fetch_source 'https://raw.githubusercontent.com/greerreNFL/Stadiums/efa9543af50b01424754219fa0e4f3c7044ff198/data/team_stadiums.csv' artifacts/football/v2j/sources/team_stadiums.csv
          for season in $(seq 2016 2025); do
            fetch_source "https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_${season}.csv.gz" "artifacts/football/v2j/sources/pbp/play_by_play_${season}.csv.gz"
            fetch_source "https://github.com/nflverse/nflverse-data/releases/download/pbp_participation/pbp_participation_${season}.csv" "artifacts/football/v2j/sources/participation/pbp_participation_${season}.csv"
            fetch_source "https://github.com/nflverse/nflverse-data/releases/download/depth_charts/depth_charts_${season}.csv" "artifacts/football/v2j/sources/depth/depth_charts_${season}.csv"
          done
      - name: Build canonical exact-head M2 manifest/control
        env:
          TZ: UTC
        run: >-
          python scripts/run_nfl_production_validation.py
          --schedule-file artifacts/football/v2j/sources/games.csv
          --pbp-dir artifacts/football/v2j/sources/pbp
          --participation-dir artifacts/football/v2j/sources/participation
          --depth-dir artifacts/football/v2j/sources/depth
          --stadium-file artifacts/football/v2j/sources/team_stadiums.csv
          --git-sha "$EVIDENCE_GIT_SHA" --start-season 2016 --end-season 2025
          --neutral-site-policy exclude_from_evaluation
          --out artifacts/football/v2j/nfl_production_validation.json
          --manifest-out artifacts/football/v2j/nfl_source_manifest.json
          --model-out artifacts/football/v2j/nfl_m2_model.json
          --qb-coverage-out artifacts/football/v2j/nfl_starting_qb_coverage.json
      - name: Run preregistered V2J first historical readout
        env:
          TZ: UTC
        run: >-
          python scripts/run_nfl_v2j_first_readout.py
          --schedule-file artifacts/football/v2j/sources/games.csv
          --pbp-dir artifacts/football/v2j/sources/pbp
          --participation-dir artifacts/football/v2j/sources/participation
          --depth-dir artifacts/football/v2j/sources/depth
          --stadium-file artifacts/football/v2j/sources/team_stadiums.csv
          --source-manifest artifacts/football/v2j/nfl_source_manifest.json
          --start-season 2016 --end-season 2025
          --out artifacts/football/v2j/nfl_v2j_first_readout.json
      - name: Build frozen real-history key audit
        run: >-
          python scripts/audit_nfl_real_history.py
          --source-file artifacts/football/v2j/sources/games.csv
          --min-season 1999 --max-season 2025
          --output artifacts/football/v2j/nfl_real_history_audit.json
      - name: Compare V2J to unchanged frozen key tolerance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from sportsedge.sports.nfl.simulator_profile import build_nfl_simulator_profile, validate_profile_fit
          audit=json.loads(Path('artifacts/football/v2j/nfl_real_history_audit.json').read_text())
          e=json.loads(Path('artifacts/football/v2j/nfl_v2j_first_readout.json').read_text())
          profile=build_nfl_simulator_profile(audit,version='nfl-v2j-first-readout-oos-key-emergent-v1')
          raw=e['candidate_distribution_profile']['signed_key_probability']
          keys=tuple(sorted(int(k) for k in profile['validation_target_key_frequency']))
          fit=validate_profile_fit(profile,{k:float(raw[str(k)]) for k in keys},max_abs_error=0.005)
          payload={'schema_version':1,'status':'FIRST_READOUT_DIAGNOSTIC_ONLY','max_abs_error':0.005,'fit':fit,'promotion_eligible':False,'promotion_authority':False,'model_p_authority':False,'official_status_granted':False,'production_registry_consumes_this_artifact':False}
          Path('artifacts/football/v2j/nfl_v2j_key_math.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          print(json.dumps(payload,sort_keys=True))
          PY
      - name: Enforce first-readout zero authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('artifacts/football/v2j/nfl_v2j_first_readout.json').read_text())
          if e.get('status')!='FIRST_READOUT_DIAGNOSTIC_ONLY' or e.get('preregistration_locked') is not True: raise SystemExit('NFL_V2J_FIRST_READOUT_LOCK_REQUIRED')
          if e.get('post_readout_retuning_allowed') is not False: raise SystemExit('NFL_V2J_RETUNING_FORBIDDEN')
          if e.get('market_prices_consumed_as_model_features') is not False: raise SystemExit('NFL_V2J_MARKET_FEATURE_CONTAMINATION')
          if e.get('prospective_outcomes_consumed_for_tuning') is not False: raise SystemExit('NFL_V2J_PROSPECTIVE_TUNING_FORBIDDEN')
          if e.get('v2h_or_v2i_readout_values_consumed_for_numeric_tuning') is not False: raise SystemExit('NFL_V2J_PRIOR_READOUT_TUNING_FORBIDDEN')
          for f in ('promotion_eligible','promotion_authority','model_p_authority','official_status_granted','production_registry_consumes_this_artifact'):
            if e.get(f) is not False: raise SystemExit('NFL_V2J_ZERO_AUTHORITY_REQUIRED:'+f)
          if e.get('nfl_props')!='NO_ENGINE': raise SystemExit('NFL_PROPS_MUST_REMAIN_NO_ENGINE')
          print(json.dumps({'status':e['status'],'historical':e['candidate_historical_evidence'],'signed_key_probability':e['candidate_distribution_profile']['signed_key_probability'],'post_readout_retuning_allowed':False,'promotion_authority':False,'nfl_props':'NO_ENGINE'},sort_keys=True))
          PY
      - name: Upload frozen V2J first-readout evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-v2j-first-readout-${{ github.sha }}
          path: |
            artifacts/football/v2j/nfl_source_manifest.json
            artifacts/football/v2j/nfl_v2j_first_readout.json
            artifacts/football/v2j/nfl_real_history_audit.json
            artifacts/football/v2j/nfl_v2j_key_math.json
          if-no-files-found: error
          retention-days: 90
