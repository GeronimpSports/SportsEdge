name: nfl-v2h-first-readout

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sportsedge/sports/nfl/m2_v2h_candidate.py'
      - 'sportsedge/sports/nfl/m2_v2h_validation.py'
      - 'scripts/run_nfl_v2h_first_readout.py'
      - 'scripts/validate_nfl_v2h_candidate.py'
      - 'tests/test_nfl_m2_v2h_candidate.py'
      - 'tests/test_nfl_v2h_first_readout_workflow.py'
      - 'config/research/nfl_v2h_scoring_sequence_model_prereg_2026-09-12.json'
      - '.github/workflows/nfl-v2h-first-readout.yml'

permissions:
  contents: read

jobs:
  first-readout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EVIDENCE_GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_GIT_SHA }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install deterministic runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.3 pytest==9.1.1

      - name: Run NFL contract tests before readout
        run: python -m unittest discover -s tests -p 'test_nfl*.py' -v

      - name: Compile V2H first-readout surface
        run: >-
          python -m py_compile
          sportsedge/sports/nfl/m2_v2h_candidate.py
          sportsedge/sports/nfl/m2_v2h_validation.py
          scripts/run_nfl_v2h_first_readout.py
          scripts/validate_nfl_v2h_candidate.py

      - name: Fetch exact frozen NFL sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/football/v2h/sources/pbp
          fetch_source() {
            curl --fail --location --silent --show-error \
              --retry 5 --retry-delay 2 --retry-all-errors \
              --connect-timeout 30 "$1" -o "$2"
          }
          fetch_source \
            'https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv' \
            artifacts/football/v2h/sources/games.csv
          for season in $(seq 2016 2025); do
            fetch_source \
              "https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_${season}.csv.gz" \
              "artifacts/football/v2h/sources/pbp/play_by_play_${season}.csv.gz"
          done

      - name: Build canonical source manifest from exact bytes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from sportsedge.sports.nfl.source_manifest import build_nfl_source_manifest, manifest_sha256

          root = Path('artifacts/football/v2h/sources')
          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          schedule = root / 'games.csv'
          schedule_sha = sha(schedule)
          sources = [{
              'name': 'schedule',
              'uri': 'https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv',
              'sha256': schedule_sha,
          }]
          for season in range(2016, 2026):
              path = root / 'pbp' / f'play_by_play_{season}.csv.gz'
              sources.append({
                  'name': f'pbp_{season}',
                  'uri': f'https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_{season}.csv.gz',
                  'sha256': sha(path),
              })
          manifest = build_nfl_source_manifest(sources, schedule_anchor_sha256=schedule_sha)
          out = Path('artifacts/football/v2h/nfl_v2h_source_manifest.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({'manifest_sha256': manifest_sha256(manifest), 'source_count': len(sources)}, sort_keys=True))
          PY

      - name: Run preregistered V2H first historical readout
        env:
          TZ: UTC
        run: >-
          python scripts/run_nfl_v2h_first_readout.py
          --schedule-file artifacts/football/v2h/sources/games.csv
          --pbp-dir artifacts/football/v2h/sources/pbp
          --source-manifest artifacts/football/v2h/nfl_v2h_source_manifest.json
          --start-season 2016 --end-season 2025
          --out artifacts/football/v2h/nfl_v2h_first_readout.json

      - name: Build frozen real-history key audit
        run: >-
          python scripts/audit_nfl_real_history.py
          --source-file artifacts/football/v2h/sources/games.csv
          --min-season 1999 --max-season 2025
          --output artifacts/football/v2h/nfl_real_history_audit.json

      - name: Compare V2H to unchanged frozen key tolerance
        run: >-
          python scripts/validate_nfl_v2h_candidate.py
          artifacts/football/v2h/nfl_real_history_audit.json
          artifacts/football/v2h/nfl_v2h_first_readout.json
          --max-abs-error 0.005
          --out artifacts/football/v2h/nfl_v2h_key_math.json

      - name: Enforce first-readout zero authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path('artifacts/football/v2h/nfl_v2h_first_readout.json').read_text())
          key_math = json.loads(Path('artifacts/football/v2h/nfl_v2h_key_math.json').read_text())
          if evidence.get('status') != 'FIRST_READOUT_DIAGNOSTIC_ONLY':
              raise SystemExit('NFL_V2H_FIRST_READOUT_STATUS_INVALID')
          if evidence.get('preregistration_locked') is not True:
              raise SystemExit('NFL_V2H_PREREG_LOCK_REQUIRED')
          if evidence.get('post_readout_retuning_allowed') is not False:
              raise SystemExit('NFL_V2H_POST_READOUT_RETUNING_FORBIDDEN')
          if evidence.get('market_prices_consumed_as_model_features') is not False:
              raise SystemExit('NFL_V2H_MARKET_FEATURE_CONTAMINATION')
          if evidence.get('prospective_outcomes_consumed_for_tuning') is not False:
              raise SystemExit('NFL_V2H_PROSPECTIVE_TUNING_FORBIDDEN')
          for payload in (evidence, key_math):
              if payload.get('promotion_authority') is not False:
                  raise SystemExit('NFL_V2H_PROMOTION_AUTHORITY_FORBIDDEN')
              if payload.get('model_p_authority') is not False:
                  raise SystemExit('NFL_V2H_MODEL_P_AUTHORITY_FORBIDDEN')
              if payload.get('promotion_eligible') is not False:
                  raise SystemExit('NFL_V2H_PROMOTION_ELIGIBILITY_FORBIDDEN')
          if evidence.get('nfl_props') != 'NO_ENGINE':
              raise SystemExit('NFL_PROPS_MUST_REMAIN_NO_ENGINE')
          print(json.dumps({
              'status': evidence['status'],
              'historical': evidence['candidate_historical_evidence'],
              'signed_key_probability': evidence['candidate_distribution_profile']['signed_key_probability'],
              'key_fit': key_math['fit'],
              'post_readout_retuning_allowed': False,
              'promotion_authority': False,
              'nfl_props': 'NO_ENGINE',
          }, sort_keys=True))
          PY

      - name: Upload frozen V2H first-readout evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-v2h-first-readout-${{ github.sha }}
          path: |
            artifacts/football/v2h/nfl_v2h_source_manifest.json
            artifacts/football/v2h/nfl_v2h_first_readout.json
            artifacts/football/v2h/nfl_real_history_audit.json
            artifacts/football/v2h/nfl_v2h_key_math.json
          if-no-files-found: error
          retention-days: 90
